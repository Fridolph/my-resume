services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5577
      API_HOST: 0.0.0.0
      DATABASE_URL: file:/app/.data/my-resume.db
    ports:
      - '5577:5577'
    volumes:
      - resume_sqlite_data:/app/.data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5577
        RESUME_API_BASE_URL: http://server:5577
    environment:
      NODE_ENV: production
      RESUME_API_BASE_URL: http://server:5577
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5577
    depends_on:
      - server
    ports:
      - '5555:5555'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5577
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5577
    depends_on:
      - server
    ports:
      - '5566:5566'

  neo4j:
    image: neo4j:latest
    container_name: neo4j-container
    ports:
      - "7474:7474"   # Web 管理界面
      - "7687:7687"   # Bolt 协议（代码连接）
    environment:
      - NEO4J_AUTH=neo4j/12345678  # 账号：neo4j  密码：12345678
      - NEO4J_PLUGINS=["apoc"]     # 安装必备插件
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - .data/volumes/neo4j/data:/data
      - .data/volumes/neo4j/logs:/logs
      - .data/volumes/neo4j/conf:/conf
    restart: unless-stopped


volumes:
  resume_sqlite_data:
  neo4j_data:
